<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- * Font Awesome -->
    <link rel="stylesheet" href="./css/all.min.css" />
    <!-- * Bootstrap -->
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <!-- * Main Style sheet -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="main-bg-color">
    <!-- login page  -->
     <section class="main-bg-color py-5 d-block" id="login">
      <div class="container py-5">
        <div class="d-flex align-items-center box-shadow py-4 flex-column mx-auto">
          <h2 class="text-capitalize text-primary">smart login System</h2>
          <form class="w-100">
            <div class="py-3">
              <input type="email" placeholder="Enter your email" class="form-control" id="logEmail">
            </div>
            <div>
              <input type="password" placeholder="Enter your password" class="form-control" id="logPassword">
            </div>
            <div>
              <button class="btn btn-outline-info w-100 my-3" type="button" id="log">Login</button>
            </div>
          </form>
          <p class="text-capitalize text-primary">
            dont have an account? <span>
            </span> <a href="#signup" id="signupLink">signup</a>
          </p>
        </div>
      </div>
     </section>

     <section class="main-bg-color py-5 d-none" id="signup">
  <div class="container py-5">
    <div class="d-flex align-items-center box-shadow py-4 flex-column mx-auto">
      <h2 class="text-capitalize text-primary">smart login System</h2>
      <form class="w-100">
        <div class="pt-3">
          <input type="text" placeholder="Enter your name" class="form-control" id="name" name="name">
          <p class="invisible m-0 p-0">write a correct name</p>
        </div>
        <div class="py-3">
          <input type="email" placeholder="Enter your email" class="form-control" id="email" name="email">
          <p class="invisible m-0 p-0">email is already sxists</p>
        </div>
        <div>
          <input type="password" placeholder="Enter a valid password" class="form-control" id="password" name="password">
        </div>
        <div>
          <button class="btn btn-outline-info w-100 my-3" id="sign" type="button">sign up</button>
        </div>
        <p class="text-primary text-capitalize"> have an account?
          <a href="#login" id="loginLink" >login</a>
        </p>
      </form>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
