<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- * Font Awesome -->
    <link rel="stylesheet" href="./css/all.min.css" />
    <!-- * Bootstrap -->
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <!-- * Main Style sheet -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="main-bg-color">
    <!-- login page  -->
  <div class="parent min-vh-100 d-flex justify-content-center align-items-center position-relative overflow-hidden">

       <section class="main-bg-color py-5 d-block" id="login">
      <div class="container py-5">
        <div class="animate d-flex align-items-center box-shadow p-5 flex-column mx-auto bg-white rounded-4 shadow-lg">
          <h2 class="text-capitalize mb-4 fs-3 text-primary text fw-bold">smart login System</h2>
          <form class="w-100">
            <div class="py-3">
              <input type="email" placeholder="Enter your email" class="form-control" id="logEmail">
            </div>
            <div>
              <input type="password" placeholder="Enter your password" class="form-control" id="logPassword">
            </div>
            <div>
              <button class="btn btn-outline-info fw-bold position-relative overflow-hidden text-white border-0 w-100 my-3 fs-6 rounded-3 px-4 py-3" type="button" id="log">Login</button>
            </div>
          </form>
          <p class="text-capitalize text-primary">
            dont have an account? <span>
            </span> <a href="#signup" id="signupLink">signup</a>
          </p>
        </div>
      </div>
     </section>

     <section class="main-bg-color py-5 d-none" id="signup">
  <div class="container py-5">
    <div class="animate d-flex align-items-center box-shadow p-5 flex-column mx-auto bg-white rounded-4 shadow-lg">
      <h2 class="text-capitalize mb-4 fs-3 text-primary text fw-bold">smart login System</h2>
      <form class="w-100">
        <div class="pt-2">
          <input type="text" placeholder="Enter your name" class="form-control" oninput="validateForm(nameRgx, nameInput)" id="name" name="name">
          <p class="invisible text-danger py-1 d-flex align-items-center gap-2">write a correct name</p>
        </div>
        <div class="py-2">
          <input type="email" placeholder="Enter your email" class="form-control" oninput="validateForm(emailRgx, emailInput)" id="email" name="email">
          <p class="invisible text-danger mt-1 d-flex align-items-center gap-2">Invalid email</p>
        </div>
        <div>
          <input type="password" placeholder="Enter a valid password" class="form-control" oninput="validateForm(passwordRgx, passwordInput)" id="password" name="password">
           <p class="invisible text-danger mt-1 d-flex align-items-center gap-2">Invalid password</p>
        </div>
        <div>
          <button class="btn btn-outline-info fw-bold position-relative overflow-hidden text-white fs-6 rounded-3 border-0 w-100 my-2 px-4 py-3" id="sign" type="button">Signup</button>
        </div>
        <p class="text-primary text-capitalize"> have an account?
          <a href="#login" id="loginLink" >login</a>
        </p>
      </form>
    </div>
  </div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
